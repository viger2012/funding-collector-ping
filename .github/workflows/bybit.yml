name: bybit-best-effort
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # CloudFront 对数据中心 IP 偶发 403，容错：失败仅记录不标红
      - run: |
          out=$(curl -sS --max-time 180 "https://funding-collector.1465529792.workers.dev/?group=bybit" || true)
          echo "$out"