name: ping-collector
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [hl-main, hl-test, aster, edgex]
    steps:
      - name: trigger
        run: |
          out=$(curl -sS --max-time 180 "https://funding-collector.1465529792.workers.dev/?group=${{ matrix.group }}")
          echo "$out"
          echo "$out" | grep -q "ERROR" && exit 1 || true